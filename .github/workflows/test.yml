name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Uses a temporary local `wrangler dev` with the test-only
      # `--var CAPTCHA_SECRET:goonchess-room-e2e`; no deployment secret is used.
      # The script signals Wrangler's Linux process group so workerd is cleaned up.
      - name: Test online room end to end
        run: npm run test:room
